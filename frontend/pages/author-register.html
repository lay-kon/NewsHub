<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Autor - NewsHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 2rem;">
        <h1>📝 Registro de Autor</h1>
        <p class="text-light">Crie sua conta para começar a publicar artigos</p>
        
        <form id="register-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="primeiro_nome">Primeiro Nome:</label>
                    <input type="text" id="primeiro_nome" name="primeiro_nome" required placeholder="Seu primeiro nome">
                </div>
                <div class="form-group">
                    <label for="ultimo_nome">Último Nome:</label>
                    <input type="text" id="ultimo_nome" name="ultimo_nome" required placeholder="Seu último nome">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Usuário:</label>
                    <input type="text" id="username" name="username" required placeholder="Escolha um usuário único">
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <div class="form-group">
                <label for="biografia">Biografia:</label>
                <textarea id="biografia" name="biografia" placeholder="Conte um pouco sobre você..."></textarea>
            </div>

            <button type="submit" class="btn btn-block">Criar Conta</button>
        </form>

        <div class="text-center mt-3">
            <p>Já tem conta? <a href="author-login.html">Fazer login</a></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                primeiro_nome: document.getElementById('primeiro_nome').value,
                ultimo_nome: document.getElementById('ultimo_nome').value,
                email: document.getElementById('email').value,
                username: document.getElementById('username').value,
                senha: document.getElementById('password').value,
                biografia: document.getElementById('biografia').value
            };

            try {
                const response = await ApiService.registroAutor(data);
                showMessage('Conta criada com sucesso! Fazendo login...', 'success');
                setTimeout(() => {
                    const loginResponse = {
                        token: response.token || 'temp',
                        autorId: response.id,
                        nome: `${data.primeiro_nome} ${data.ultimo_nome}`
                    };
                    AuthService.login(loginResponse.token, 'author', loginResponse.autorId, loginResponse.nome);
                }, 1000);
            } catch (error) {
                console.error('Registration error:', error);
                showMessage('Erro ao criar conta. Tente novamente.', 'error');
            }
        });
    </script>
</body>
</html>
