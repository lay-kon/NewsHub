<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Autor - NewsHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 3rem;">
        <h1>✍️ Login de Autor</h1>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
            </div>
            <div class="form-group">
                <label for="password">Senha:</label>
                <div class="password-toggle-wrapper">
                    <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                    <button type="button" id="toggle-author-login-password" class="password-toggle">Mostrar</button>
                </div>
            </div>
            <button type="submit" class="btn btn-block">Entrar</button>
        </form>

        <div class="text-center mt-3">
            <p>Não tem conta? <a href="author-register.html">Criar conta de autor</a></p>
            <p><a href="index.html">Voltar à página inicial</a></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const toggleVisibility = (inputId, toggleId) => {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            toggle.addEventListener('click', () => {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                toggle.textContent = isPassword ? 'Ocultar' : 'Mostrar';
            });
        };

        toggleVisibility('password', 'toggle-author-login-password');

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await ApiService.loginAutor({ username, senha: password });
                AuthService.login(response.token, 'author', response.autorId, response.nome);
                showMessage('Login realizado com sucesso!', 'success');
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Erro no login. Verifique suas credenciais.', 'error');
            }
        });
    </script>
</body>
</html>
