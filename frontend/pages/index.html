<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsHub - Portal de Notícias</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>Últimas Notícias</h1>
        <div id="news-grid" class="grid">
            <!-- News cards will be loaded here -->
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/api.js"></script>
    <script>
        async function loadNews() {
            try {
                const publicacoes = await ApiService.getPublicacoes();
                const published = publicacoes.filter(p => p.estado === 'publicado');
                
                const grid = document.getElementById('news-grid');
                grid.innerHTML = published.map(pub => `
                    <div class="card">
                        ${pub.imagem_destaque ? `<img src="${pub.imagem_destaque}" alt="${pub.titulo}">` : ''}
                        <div class="card-content">
                            <h3>${pub.titulo}</h3>
                            <p>${truncateText(pub.resumo)}</p>
                            <p><small>Por ${pub.primeiro_nome} ${pub.ultimo_nome} em ${formatDate(pub.data_publicacao)}</small></p>
                            <a href="detalhes.html?id=${pub.idPublicacao}" class="btn">Ler mais</a>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading news:', error);
                showMessage('Erro ao carregar notícias', 'error');
            }
        }

        loadNews();
    </script>
</body>
</html>
