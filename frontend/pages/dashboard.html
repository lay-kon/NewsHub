<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - NewsHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="flex-between mb-3">
            <h1>⚙️ Dashboard Administrador</h1>
            <button id="logout-btn" class="btn btn-danger">Logout</button>
        </div>

        <div class="section">
            <h2>Publicações Pendentes de Aprovação</h2>
            <div id="pending-publications" class="grid">
                <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">
                    <p>Carregando...</p>
                </div>
            </div>
        </div>

        <hr style="border: none; border-top: 2px solid var(--border); margin: 2rem 0;">

        <div class="section">
            <h2>Criar Nova Publicação</h2>
            <form id="create-publication-form">
                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" required placeholder="Título da publicação">
                </div>
                <div class="form-group">
                    <label for="resumo">Resumo:</label>
                    <textarea id="resumo" required placeholder="Resumo ou descrição breve..."></textarea>
                </div>
                <div class="form-group">
                    <label for="conteudo">Conteúdo Completo:</label>
                    <textarea id="conteudo" required placeholder="Conteúdo completo da publicação..." style="min-height: 200px;"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="idautor">ID do Autor:</label>
                        <input type="number" id="idautor" required placeholder="Exemplo: 1">
                    </div>
                    <div class="form-group">
                        <label for="idCategoria">Categoria:</label>
                        <select id="idCategoria" required>
                            <option value="">Carregando categorias...</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="imagem_destaque">URL da Imagem:</label>
                        <input type="text" id="imagem_destaque" placeholder="URL da imagem de destaque">
                    </div>
                </div>
                <button type="submit" class="btn btn-block">Criar Publicação</button>
            </form>
        </div>

        <hr style="border: none; border-top: 2px solid var(--border); margin: 2rem 0;">

        <div class="section">
            <h2>Gerenciar Categorias</h2>
            <form id="create-category-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="categoria_nome">Nome da Categoria:</label>
                        <input type="text" id="categoria_nome" required placeholder="Ex: Tecnologia">
                    </div>
                </div>
                <button type="submit" class="btn btn-block">Criar Categoria</button>
            </form>
            <div id="category-list" class="grid" style="margin-top: 1.5rem;">
                <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">
                    <p>Carregando categorias...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Verificar autenticação
        if (!AuthService.isLoggedIn() || !AuthService.isAdmin()) {
            window.location.href = 'login.html';
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            AuthService.logout();
        });

        async function loadCategories() {
            try {
                const categorias = await ApiService.getCategorias();
                const select = document.getElementById('idCategoria');
                select.innerHTML = '<option value="">Selecione uma categoria</option>';

                if (categorias.length === 0) {
                    select.innerHTML = '<option value="">Nenhuma categoria disponível</option>';
                    select.disabled = true;
                    return;
                }

                categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.idCategoria;
                    option.textContent = cat.nome;
                    select.appendChild(option);
                });
                select.disabled = false;
            } catch (error) {
                console.error('Error loading categories:', error);
                const select = document.getElementById('idCategoria');
                select.innerHTML = '<option value="">Erro ao carregar categorias</option>';
                select.disabled = true;
            }
        }

        async function loadCategoryList() {
            try {
                const categorias = await ApiService.getCategorias();
                const container = document.getElementById('category-list');
                if (!container) return;

                if (categorias.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem;"><p>Nenhuma categoria cadastrada.</p></div>';
                    return;
                }

                container.innerHTML = categorias.map(cat => `
                    <div class="card">
                        <div class="card-content">
                            <h3>${cat.nome}</h3>
                            <button class="btn btn-small btn-danger" onclick="deleteCategory(${cat.idCategoria})">Excluir</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading category list:', error);
                document.getElementById('category-list').innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem;"><p>Erro ao carregar categorias.</p></div>';
            }
        }

        async function loadPendingPublications() {
            try {
                const publicacoes = await ApiService.getPublicacoes();
                const pending = publicacoes.filter(p => p.estado === 'pendente');
                
                const container = document.getElementById('pending-publications');
                
                if (pending.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem;"><p>✓ Nenhuma publicação pendente!</p></div>';
                    return;
                }

                container.innerHTML = pending.map(pub => `
                    <div class="card">
                        <div class="card-content">
                            <h3>${pub.titulo}</h3>
                            <p>${truncateText(pub.resumo, 100)}</p>
                            <p><small><strong>${pub.primeiro_nome} ${pub.ultimo_nome}</strong></small></p>
                            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                                <button class="btn btn-small btn-success" onclick="validatePublication(${pub.idPublicacao})">✓ Aprovar</button>
                                <button class="btn btn-small btn-danger" onclick="rejectPublication(${pub.idPublicacao})">✕ Rejeitar</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading pending publications:', error);
                document.getElementById('pending-publications').innerHTML = '<div style="grid-column: 1/-1;" class="alert alert-error">Erro ao carregar publicações pendentes.</div>';
            }
        }

        async function validatePublication(id) {
            try {
                await ApiService.request(`/publicacoes/${id}/validate`, { method: 'POST' });
                showMessage('Publicação aprovada!', 'success');
                loadPendingPublications();
            } catch (error) {
                console.error('Error validating publication:', error);
                showMessage('Erro ao aprovar publicação', 'error');
            }
        }

        async function rejectPublication(id) {
            if (confirm('Tem certeza que deseja rejeitar esta publicação?')) {
                try {
                    await ApiService.updatePublicacao(id, { idestado: 4 }); // 4 = rejeitado
                    showMessage('Publicação rejeitada!', 'success');
                    loadPendingPublications();
                } catch (error) {
                    console.error('Error rejecting publication:', error);
                    showMessage('Erro ao rejeitar publicação', 'error');
                }
            }
        }

        async function deleteCategory(id) {
            if (!confirm('Deseja realmente excluir esta categoria?')) return;
            try {
                await ApiService.deleteCategoria(id);
                showMessage('Categoria excluída com sucesso!', 'success');
                loadCategoryList();
                loadCategories();
            } catch (error) {
                console.error('Error deleting category:', error);
                showMessage('Erro ao excluir categoria', 'error');
            }
        }

        document.getElementById('create-category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('categoria_nome').value;
            try {
                await ApiService.createCategoria({ nome });
                showMessage('Categoria criada com sucesso!', 'success');
                e.target.reset();
                loadCategoryList();
                loadCategories();
            } catch (error) {
                console.error('Error creating category:', error);
                showMessage('Erro ao criar categoria', 'error');
            }
        });

        document.getElementById('create-publication-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                titulo: document.getElementById('titulo').value,
                resumo: document.getElementById('resumo').value,
                conteudo: document.getElementById('conteudo').value,
                imagem_destaque: document.getElementById('imagem_destaque').value || null,
                idestado: 3, // publicado direto pelo admin
                idautor: parseInt(document.getElementById('idautor').value),
                idCategoria: parseInt(document.getElementById('idCategoria').value) || null
            };

            try {
                await ApiService.createPublicacao(data);
                showMessage('Publicação criada e publicada com sucesso!', 'success');
                e.target.reset();
                loadPendingPublications();
            } catch (error) {
                console.error('Error creating publication:', error);
                showMessage('Erro ao criar publicação', 'error');
            }
        });

        loadCategories();
        loadCategoryList();
        loadPendingPublications();
    </script>
</body>
</html>
