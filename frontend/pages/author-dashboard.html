<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Autor - NewsHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="flex-between mb-3">
            <h1>📝 Minhas Publicações</h1>
            <button id="logout-btn" class="btn btn-danger">Logout</button>
        </div>

        <div class="section">
            <h2>Criar Nova Publicação</h2>
            <form id="create-publication-form">
                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" required placeholder="Título do artigo">
                </div>
                <div class="form-group">
                    <label for="resumo">Resumo:</label>
                    <textarea id="resumo" required placeholder="Resumo ou descrição breve..."></textarea>
                </div>
                <div class="form-group">
                    <label for="conteudo">Conteúdo Completo:</label>
                    <textarea id="conteudo" required placeholder="Escreva seu artigo aqui..." style="min-height: 250px;"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="imagem_destaque">URL da Imagem de Destaque:</label>
                        <input type="text" id="imagem_destaque" placeholder="https://exemplo.com/imagem.jpg">
                    </div>
                    <div class="form-group">
                        <label for="idCategoria">Categoria (ID):</label>
                        <input type="number" id="idCategoria" placeholder="ID da categoria">
                    </div>
                </div>
                <button type="submit" class="btn btn-block">Publicar Artigo</button>
            </form>
        </div>

        <hr style="border: none; border-top: 2px solid var(--border); margin: 2rem 0;">

        <div class="section">
            <h2>Meus Artigos</h2>
            <div id="my-publications" class="grid">
                <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">
                    <p>Carregando seus artigos...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Verificar autenticação
        if (!AuthService.isLoggedIn() || !AuthService.isAuthor()) {
            window.location.href = 'author-login.html';
        }

        const currentAuthorId = parseInt(AuthService.getUserId());

        document.getElementById('logout-btn').addEventListener('click', () => {
            AuthService.logout();
        });

        async function loadMyPublications() {
            try {
                const publicacoes = await ApiService.getPublicacoes();
                const myPubs = publicacoes.filter(p => p.idautor === currentAuthorId);
                
                const container = document.getElementById('my-publications');
                
                if (myPubs.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem;"><p>Você ainda não publicou nenhum artigo.</p></div>';
                    return;
                }

                container.innerHTML = myPubs.map(pub => `
                    <div class="card">
                        ${pub.imagem_destaque ? `<img src="${pub.imagem_destaque}" alt="${pub.titulo}" onerror="this.style.display='none'">` : ''}
                        <div class="card-content">
                            <h3>${pub.titulo}</h3>
                            <p>${truncateText(pub.resumo, 100)}</p>
                            <div class="card-meta">
                                <div>
                                    <small>${formatDate(pub.data_publicacao)}</small>
                                </div>
                                <span class="estado estado-${pub.estado}">${pub.estado}</span>
                            </div>
                            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                                <a href="detalhes.html?id=${pub.idPublicacao}" class="btn btn-small">Ver</a>
                                <button class="btn btn-small btn-secondary" onclick="editPublication(${pub.idPublicacao})">Editar</button>
                                <button class="btn btn-small btn-danger" onclick="deletePublication(${pub.idPublicacao})">Deletar</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading publications:', error);
                document.getElementById('my-publications').innerHTML = '<div style="grid-column: 1/-1;" class="alert alert-error">Erro ao carregar seus artigos.</div>';
            }
        }

        function editPublication(id) {
            alert('Funcionalidade de edição em desenvolvimento. ID: ' + id);
            // TODO: Implementar edição
        }

        async function deletePublication(id) {
            if (confirm('Tem certeza que deseja deletar este artigo?')) {
                try {
                    await ApiService.deletePublicacao(id);
                    showMessage('Artigo deletado com sucesso!', 'success');
                    loadMyPublications();
                } catch (error) {
                    console.error('Error deleting publication:', error);
                    showMessage('Erro ao deletar artigo', 'error');
                }
            }
        }

        document.getElementById('create-publication-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                titulo: document.getElementById('titulo').value,
                resumo: document.getElementById('resumo').value,
                conteudo: document.getElementById('conteudo').value,
                imagem_destaque: document.getElementById('imagem_destaque').value || null,
                idestado: 2, // pendente (será aprovado por admin)
                idautor: currentAuthorId,
                idCategoria: parseInt(document.getElementById('idCategoria').value) || null
            };

            try {
                await ApiService.createPublicacao(data);
                showMessage('Artigo enviado para análise! Um administrador revisará em breve.', 'success');
                e.target.reset();
                loadMyPublications();
            } catch (error) {
                console.error('Error creating publication:', error);
                showMessage('Erro ao publicar artigo', 'error');
            }
        });

        loadMyPublications();
    </script>
</body>
</html>
